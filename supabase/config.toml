project_id = "mzansi-motor-stack"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

# For local Supabase CLI use, enable Clerk third-party JWT validation and set
# the issuer domain copied from Clerk > Configure > Supabase. Production is
# configured separately in Supabase Dashboard > Authentication > Third-party.
# [auth.third_party.clerk]
# enabled = true
# domain = "https://your-instance.clerk.accounts.dev"

[functions.paystack-checkout]
verify_jwt = true

[functions.paystack-verify]
verify_jwt = true

[functions.paystack-webhook]
verify_jwt = false

[functions.provision-clerk-profile]
verify_jwt = true

[functions.check-pending-invitation]
verify_jwt = true

[functions.accept-clerk-invitation]
verify_jwt = true

[functions.create-clerk-invitation]
verify_jwt = true

[functions.revoke-clerk-invitation]
verify_jwt = true
